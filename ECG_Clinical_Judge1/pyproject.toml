[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mavis-ecg"
version = "0.1.0"
description = "MAVIS: ECG-anchored clinical evidence assessment and bounded prediction correction"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24,<2", "pandas>=2.0,<3", "scikit-learn>=1.3,<1.6", "scipy>=1.10", "joblib>=1.3", "PyYAML>=6", "python-dotenv>=1", "requests>=2.31"]

[project.optional-dependencies]
training = ["torch>=2.1", "wfdb>=4.1", "tqdm>=4.65"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
